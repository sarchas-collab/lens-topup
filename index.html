<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Lens Top-up</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lens Top-up">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@font-face{font-family:Founders;src:local('Founders Grotesk')}
:root{
 --bg:#0d1117;--card:#161b22;--surface:#21262d;
 --border:#30363d;--orange:#f97316;--green:#22c55e;
}
body{background:var(--bg);color:#f0f6fc;font-family:Founders,'Helvetica Neue',Arial,sans-serif;letter-spacing:.02em;
 padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);
 -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
.navbar-custom{position:sticky;top:0;z-index:1000;padding-top:calc(env(safe-area-inset-top) + .75rem)!important}
.btn-refresh{background:var(--surface);color:#f0f6fc;border:1px solid var(--border);border-radius:10px;width:40px;height:40px;
 font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.btn-refresh:active{background:var(--border)}
.btn-refresh.spinning span{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.update-bar{font-size:.75rem;color:#8b949e;text-align:center;margin:-12px 0 12px}
.update-bar.offline{color:#fbbf24}
.navbar-custom{background:linear-gradient(135deg,#161b22,#0d1117);border-bottom:2px solid var(--orange);box-shadow:0 4px 15px #f9731633}
.card-custom,.card-filter{background:var(--card);border:1px solid var(--border);border-radius:16px;color:#f0f6fc}
.card-filter{box-shadow:0 10px 25px -5px #0008}
.form-select-custom{background:var(--surface);color:white;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-weight:600}
.form-select-custom:focus{background:var(--surface);color:white;border-color:var(--orange);box-shadow:0 0 0 .25rem #f9731640}
.btn-submit{background:linear-gradient(135deg,#f97316,#ea580c);color:white;border:0;border-radius:10px;padding:12px;font-weight:700;width:100%}
.btn-submit:hover{background:#ea580c;color:white}
.btn-back{background:var(--surface);color:white;border:1px solid var(--border);font-weight:700}
.nav-tabs-custom{display:flex;flex-wrap:wrap;gap:6px}
.nav-tabs-custom .nav-item{flex:1 1 auto;text-align:center}
.nav-tabs-custom .nav-link{width:100%;white-space:nowrap;background:var(--card);color:#8b949e;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.88rem;font-weight:700}
.nav-tabs-custom .nav-link.active{background:linear-gradient(135deg,#f97316,#ea580c);color:white;border-color:var(--orange)}
.month-btn-group{display:flex;overflow-x:auto;gap:5px;padding-bottom:8px}
.month-btn-group .btn{flex:0 0 auto;font-size:.85rem}
.btn-orange-outline{border:1px solid var(--orange);color:var(--orange);font-weight:700}
.btn-orange-active{background:var(--orange)!important;color:white!important;border:1px solid var(--orange)!important;font-weight:700}
.stat-card-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 5px;height:100%}
.stat-card-box .label-title{display:block;font-size:.72rem;color:#fbbf24;font-weight:600;margin-bottom:4px}
.stat-card-box .val-num{display:block;font-size:1.05rem;font-weight:700;color:white}
.stat-card-box.highlight-card{background:#1c2d27;border-color:var(--green)}
.stat-card-box.highlight-card .label-title,.stat-card-box.highlight-card .val-num{color:#4ade80}
.table-responsive-custom{background:white;border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-custom{min-width:680px;margin-bottom:0;background:white;color:#0f172a}
.table-custom thead th{background:#0f172a;color:#f59e0b;font-size:.82rem;padding:12px 8px;white-space:nowrap;border:0}
.table-custom tbody td{padding:11px 8px;font-size:.9rem;background:white;color:#0f172a;border-bottom:1px solid #e2e8f0}
.table-custom tbody tr:hover td{background:#f8fafc}
.branch-name-cell{font-weight:700;color:#0f172a!important;white-space:nowrap}
.branch-clickable{color:#0284c7;text-decoration:underline;cursor:pointer;font-weight:700}
.area-clickable{color:#d97706;text-decoration:underline;cursor:pointer;font-weight:700}
.badge-rank{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#64748b;color:white;font-weight:700}
.rank-1{background:#fef08a;color:#854d0e}
.rank-2{background:#e2e8f0;color:#1e293b}
.rank-3{background:#ffedd5;color:#9a3412}
.chart-container-box{position:relative;height:300px;width:100%}
.section-header{background:linear-gradient(135deg,#161b22,#0d1117);border-left:5px solid var(--orange)}
.note-text{font-size:.8rem;color:#8b949e}
@media(max-width:576px){
.navbar-brand{font-size:1.05rem!important}
.card-custom,.card-filter{border-radius:12px}
.nav-tabs-custom .nav-link{font-size:.8rem;padding:8px}
.chart-container-box{height:250px}
}
</style>
</head>
<body>

<nav class="navbar navbar-custom py-3 mb-4">
<div class="container px-3 d-flex align-items-center justify-content-between flex-nowrap">
<span class="navbar-brand text-white fw-bold mb-0 text-truncate">
📊 Lens Top-up Analytics & Performance
</span>
<button type="button" id="btn-refresh" class="btn-refresh" onclick="refreshData(true)" title="ดึงข้อมูลล่าสุด" aria-label="ดึงข้อมูลล่าสุด"><span>🔄</span></button>
</div>
</nav>

<div class="container px-2 px-sm-3 pb-5">
<div id="update-bar" class="update-bar"></div>
<div id="loading-spinner" class="text-center py-5">
<div class="spinner-border text-warning"></div>
<h6 class="mt-3 text-light">กำลังโหลดข้อมูล...</h6>
</div>

<div id="home-view" style="display:none">
<div class="row justify-content-center">
<div class="col-12 col-lg-11">

<ul class="nav nav-pills nav-tabs-custom mb-4 p-2 rounded-3" style="background:#161b22">
<li class="nav-item"><button class="nav-link active" id="tab-month-area" onclick="switchMode('month-area')">📅 รายเดือน + Area</button></li>
<li class="nav-item"><button class="nav-link" id="tab-branch" onclick="switchMode('branch')">🏪 รายสาขา (Branch Trend)</button></li>
<li class="nav-item"><button class="nav-link" id="tab-area" onclick="switchMode('area')">🏢 ราย Area (Area Trend)</button></li>
<li class="nav-item"><button class="nav-link" id="tab-all-stores" onclick="switchMode('all-stores')">📊 รวมทุกสาขา & Ranking</button></li>
</ul>

<div id="form-month-area" class="card card-filter p-3 p-md-5 mx-auto" style="max-width:650px">
<h5 class="text-warning text-center fw-bold mb-4">🔍 ดูข้อมูลย่อย Area ประจำเดือน</h5>
<label class="form-label">📅 เลือกเดือน</label>
<select id="monthSelect" class="form-select form-select-custom mb-4"></select>
<label class="form-label">🏢 เลือก Area</label>
<select id="areaSelect1" class="form-select form-select-custom mb-4"></select>
<button class="btn btn-submit" onclick="openMonthAreaDetail(document.getElementById('monthSelect').value,document.getElementById('areaSelect1').value)">🚀 เข้าดูข้อมูลย่อย</button>
</div>

<div id="form-branch" class="card card-filter p-3 p-md-5 mx-auto" style="max-width:650px;display:none">
<h5 class="text-warning text-center fw-bold mb-4">📈 ดูพัฒนาการรายสาขา</h5>
<label class="form-label">🏪 เลือกสาขา</label>
<select id="branchSelect" class="form-select form-select-custom mb-4"></select>
<button class="btn btn-submit" onclick="openBranchDetail(document.getElementById('branchSelect').value)">📊 ดูตัวเลขแยกตามเดือน & กราฟพัฒนาการ</button>
</div>

<div id="form-area" class="card card-filter p-3 p-md-5 mx-auto" style="max-width:650px;display:none">
<h5 class="text-warning text-center fw-bold mb-4">📈 ดูพัฒนาการราย Area</h5>
<label class="form-label">🏢 เลือก Area</label>
<select id="areaSelect2" class="form-select form-select-custom mb-4"></select>
<button class="btn btn-submit" onclick="openAreaTrendDetail(document.getElementById('areaSelect2').value)">📊 ดูตัวเลขแยกตามเดือน & กราฟพัฒนาการ</button>
</div>

<div id="form-all-stores" style="display:none">
<div id="all-stores-container"></div>
</div>

</div>
</div>
</div>

<div id="detail-view" style="display:none">
<button class="btn btn-back mb-4" onclick="showHomeView()">⬅️ กลับหน้าเลือกข้อมูล</button>
<div id="detail-content"></div>
</div>
</div>

<script>
'use strict';

let globalData=null;
let selectedRankMonth='APR2026';
let charts=[];

const METRICS=[
 ['freeSingle','Standard Package'],
 ['freeTotal','Standard Package Total'],
 ['paidProgressive','Progressive-Related Top-up'],
 ['paidSingle','Single Vision-Related Top-up'],
 ['paidTotal','Top-up Total']
];

const AGE_LABELS=['≤19','20–29','30–39','40–49','50–59','60+'];

function el(id){return document.getElementById(id)}

function esc(s){
 return String(s==null?'':s)
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;')
 .replace(/'/g,'&#39;');
}

function num(v){return Number(v||0).toLocaleString()}

function pct(v){
 return v==null||!Number.isFinite(Number(v))
 ?'N/A':Number(v).toFixed(2)+'%';
}

function agePct(a){
 return a&&a.total?pct(a.age40PlusPct):'N/A';
}

function blankAge(){
 return {groups:[0,0,0,0,0,0],male:[0,0,0,0,0,0],
 female:[0,0,0,0,0,0],total:0,age40Plus:0,age40PlusPct:null};
}

function cleanupCharts(){
 charts.forEach(c=>{try{c.destroy()}catch(e){}});
 charts=[];
}

function makeChart(id,labels,datasets){
 const canvas=el(id);
 if(!canvas||typeof Chart==='undefined')return;

 const chart=new Chart(canvas.getContext('2d'),{
 type:'line',
 data:{
 labels,
 datasets:datasets.map((d,i)=>({
 label:d.label,
 data:d.data,
 borderColor:i===0?'#f97316':'#10b981',
 backgroundColor:i===0?'rgba(249,115,22,.12)':'rgba(16,185,129,.12)',
 borderWidth:2.5,
 tension:.3,
 pointRadius:3,
 spanGaps:false
 }))
 },
 options:{
 responsive:true,
 maintainAspectRatio:false,
 plugins:{
 legend:{position:'top',labels:{color:'#f0f6fc',font:{weight:'bold',size:11}}}
 },
 scales:{
 x:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}},
 y:{beginAtZero:true,ticks:{color:'#8b949e',callback:v=>v+'%'},grid:{color:'#21262d'}}
 }
 }
 });
 charts.push(chart);
}

function heading(label,title){
 return `
 <div class="card card-custom section-header p-3 p-md-4 mb-4">
 <div class="text-warning fw-bold small mb-2">${esc(label)}</div>
 <h4 class="fw-bold text-white m-0">${esc(title)}</h4>
 </div>`;
}

function statCards(item){
 return `<div class="row g-2 text-center row-cols-2 row-cols-sm-3 row-cols-md-5">
 ${METRICS.map(([key,label],i)=>`
 <div class="col">
 <div class="stat-card-box ${i===4?'highlight-card':''}">
 <span class="label-title">${label}</span>
 <span class="val-num">${esc(item?.[key]??'N/A')}</span>
 </div></div>`).join('')}
 </div>`;
}

function ageCards(age,progressive){
 const a=age||blankAge();
 return `
 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">👥 Customer Age Group Analysis</h6>
 <div class="row g-2 text-center row-cols-2 row-cols-md-4 mb-3">
 <div class="col"><div class="stat-card-box">
 <span class="label-title">Total Customers</span>
 <span class="val-num">${a.matched?num(a.total):'N/A'}</span>
 </div></div>
 <div class="col"><div class="stat-card-box">
 <span class="label-title">Customers Age 40+</span>
 <span class="val-num">${a.matched?num(a.age40Plus):'N/A'}</span>
 </div></div>
 <div class="col"><div class="stat-card-box highlight-card">
 <span class="label-title">Age 40+ (%)</span>
 <span class="val-num">${agePct(a)}</span>
 </div></div>
 <div class="col"><div class="stat-card-box">
 <span class="label-title">Progressive-Related Top-up</span>
 <span class="val-num">${esc(progressive??'N/A')}</span>
 </div></div>
 </div>
 <div class="table-responsive-custom">
 <table class="table table-custom align-middle">
 <thead><tr>
 ${AGE_LABELS.map(x=>`<th class="text-end">${x}</th>`).join('')}
 <th class="text-end">Age 40+</th>
 <th class="text-end">Age 40+ (%)</th>
 </tr></thead>
 <tbody><tr>
 ${a.groups.map(x=>`<td class="text-end">${a.matched?num(x):'N/A'}</td>`).join('')}
 <td class="text-end fw-bold">${a.matched?num(a.age40Plus):'N/A'}</td>
 <td class="text-end fw-bold">${agePct(a)}</td>
 </tr></tbody></table></div>
 <p class="note-text mt-3 mb-0">
 Age 40+ = (40–49 + 50–59 + 60+) / Total customers with age data.
 </p></div>`;
}

function tableWrap(headers,rows){
 return `<div class="table-responsive-custom">
 <table class="table table-custom align-middle">
 <thead><tr>${headers.map((h,i)=>`<th class="${i?'text-end':''}">${esc(h)}</th>`).join('')}</tr></thead>
 <tbody>${rows||'<tr><td colspan="12">ไม่มีข้อมูล</td></tr>'}</tbody>
 </table></div>`;
}

function metricHeaders(first){
 return [first,...METRICS.map(x=>x[1])];
}

function metricCells(item){
 return METRICS.map(([key],i)=>`
 <td class="text-end fw-semibold"
 style="${i===4?'color:#15803d!important':''}">
 ${esc(item?.[key]??'-')}</td>`).join('');
}

function showHomeView(fromPop){
 cleanupCharts();
 el('detail-view').style.display='none';
 el('home-view').style.display='block';
 window.scrollTo(0,0);
 // กราฟของแท็บ "รวมทุกสาขา" ถูกล้างไปตอนเปิดหน้ารายละเอียด → วาดใหม่
 if(el('form-all-stores').style.display==='block')renderAllStoresInline();
 if(!fromPop&&history.state&&history.state.view==='detail')history.back();
}

function showDetail(html){
 cleanupCharts();
 el('home-view').style.display='none';
 el('detail-view').style.display='block';
 el('detail-content').innerHTML=html;
 window.scrollTo(0,0);
 if(!history.state||history.state.view!=='detail'){
 history.pushState({view:'detail'},'');
 }
}

// ปุ่ม Back ของ Android / ปัดย้อนกลับบน iPhone → กลับหน้าเลือกข้อมูล
window.addEventListener('popstate',function(){
 if(el('detail-view').style.display==='block')showHomeView(true);
});

function switchMode(mode){
 ['month-area','branch','area','all-stores'].forEach(m=>{
 el('tab-'+m).classList.toggle('active',m===mode);
 el('form-'+m).style.display=m===mode?'block':'none';
 });
 if(mode==='all-stores')renderAllStoresInline();
}

function populateDropdowns(){
 const add=(id,values,prefix)=>{
 const select=el(id);
 const prev=select.value;
 select.innerHTML='';
 values.forEach(v=>select.add(new Option(prefix+v,v)));
 if(prev&&values.includes(prev))select.value=prev;
 };
 add('monthSelect',globalData.months,'เดือน ');
 add('areaSelect1',globalData.areas,'Area: ');
 add('areaSelect2',globalData.areas,'Area: ');
 add('branchSelect',globalData.branchesList,'สาขา: ');
}

/* ================== ตั้งค่า (แก้ 2 บรรทัดนี้) ================== */
const API_URL='https://script.google.com/macros/s/AKfycbxeidgAo1UsB53ZaABB7Nn_nq78DWRZv_D1tzt9iQ4htyjzYbznMShFRIiMnHcy_z4xhA/exec';
const API_KEY='topup2894'; // ต้องตรงกับ API_KEY ใน Code.gs
/* ============================================================== */

const STORAGE_KEY='lens_dash_v8';
let dashboardReady=false;
let isFetching=false;
let lastFetch=0;

function initDashboard(data){
 globalData=data;
 selectedRankMonth=data.months[0]||'APR2026';
 el('loading-spinner').style.display='none';
 el('home-view').style.display='block';
 populateDropdowns();
 dashboardReady=true;
 if(!data.ageStatus?.sheetFound){
 console.warn('AGE_DATA sheet not found');
 }
}

// อัปเดตข้อมูลใหม่โดยไม่รีเซ็ตหน้าที่ผู้ใช้กำลังดู
function applyFreshData(data){
 globalData=data;
 if(!data.months.includes(selectedRankMonth)){
 selectedRankMonth=data.months[0]||selectedRankMonth;
 }
 populateDropdowns();
 if(el('home-view').style.display==='block'&&
 el('form-all-stores').style.display==='block'){
 renderAllStoresInline();
 }
}

function setUpdateBar(iso){
 const bar=el('update-bar');
 bar.classList.remove('offline');
 if(!iso){bar.textContent='';return;}
 bar.textContent='อัปเดตข้อมูลล่าสุด: '+
 new Date(iso).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
}

async function refreshData(force){
 if(isFetching)return;
 isFetching=true;
 lastFetch=Date.now();
 const btn=el('btn-refresh');
 btn.classList.add('spinning');

 try{
 const url=API_URL+'?key='+encodeURIComponent(API_KEY)+
 (force?'&refresh=1':'')+'&t='+Date.now();
 const res=await fetch(url,{redirect:'follow'});
 const json=await res.json();
 if(!json.ok){
 throw new Error(json.error==='unauthorized'?'API_KEY ไม่ถูกต้อง':json.error);
 }

 try{
 localStorage.setItem(STORAGE_KEY,
 JSON.stringify({updatedAt:json.updatedAt,data:json.data}));
 }catch(e){}

 if(!dashboardReady)initDashboard(json.data);
 else applyFreshData(json.data);
 setUpdateBar(json.updatedAt);

 }catch(err){
 if(!dashboardReady){
 el('loading-spinner').innerHTML=
 `<div class="alert alert-danger">❌ โหลดข้อมูลไม่สำเร็จ: ${esc(err?.message||err)}
 <br><small>ตรวจสอบอินเทอร์เน็ต แล้วกดปุ่ม 🔄 ด้านบนเพื่อลองใหม่</small></div>`;
 }else{
 const bar=el('update-bar');
 bar.classList.add('offline');
 bar.textContent='⚠️ ออฟไลน์ — กำลังแสดงข้อมูลที่บันทึกไว้ในเครื่อง';
 }
 }finally{
 isFetching=false;
 btn.classList.remove('spinning');
 }
}

function loadDashboard(){
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){}

 if(cached&&cached.data){
 initDashboard(cached.data); // แสดงข้อมูลในเครื่องทันที
 setUpdateBar(cached.updatedAt);
 }
 refreshData(false); // แล้วดึงข้อมูลใหม่เบื้องหลัง

 if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
 }
}

// กลับมาเปิดแอปหลังผ่านไปเกิน 10 นาที → ดึงข้อมูลใหม่
document.addEventListener('visibilitychange',function(){
 if(document.visibilityState==='visible'&&Date.now()-lastFetch>10*60*1000){
 refreshData(false);
 }
});

/* MONTH + AREA */

function openMonthAreaDetail(month,area){
 const group=(globalData.dataMap[month]||{})[area];

 if(!group){
 showDetail(heading(month,'Area: '+area)+
 '<div class="alert alert-warning">ไม่พบข้อมูล</div>');
 return;
 }

 const summary=group.summary||{};
 const rows=(group.branches||[]).map(b=>`
 <tr>
 <td class="branch-name-cell">
 <span class="branch-clickable" data-branch="${esc(b.name)}">${esc(b.name)}</span>
 </td>
 ${metricCells(b)}
 <td class="text-end fw-bold">${agePct(b.age)}</td>
 </tr>`).join('');

 showDetail(`
 ${heading('📅 ประจำเดือน: '+month,'🏢 Area: '+area)}
 <div class="card card-custom p-3 mb-4">
 <h6 class="fw-bold text-warning mb-3">📊 สรุปภาพรวม Area</h6>
 ${statCards(summary)}
 </div>
 ${ageCards(group.age,summary.paidProgressive)}
 <div class="card card-custom p-3 p-md-4">
 <h6 class="fw-bold text-warning mb-3">📍 ข้อมูลตัวเลขย่อย (${esc(month)})</h6>
 ${tableWrap([...metricHeaders('สาขา'),'Age 40+ (%)'],rows)}
 </div>`);
}

/* MONTHLY TREND */

function trendRows(items){
 return globalData.months.map((m,i)=>`
 <tr>
 <td class="branch-name-cell">${esc(m)}</td>
 ${metricCells(items[i])}
 <td class="text-end fw-bold">${agePct(items[i]?.age)}</td>
 </tr>`).join('');
}

function ageMonthlyTable(items){
 const headers=[
 'Month',...AGE_LABELS,'Total','Age 40+',
 'Age 40+ (%)','Progressive Top-up (%)'
 ];

 const rows=globalData.months.map((m,i)=>{
 const a=items[i]?.age||blankAge();
 return `<tr>
 <td class="branch-name-cell">${esc(m)}</td>
 ${a.groups.map(v=>`<td class="text-end">${a.matched?num(v):'N/A'}</td>`).join('')}
 <td class="text-end">${a.matched?num(a.total):'N/A'}</td>
 <td class="text-end">${a.matched?num(a.age40Plus):'N/A'}</td>
 <td class="text-end fw-bold">${agePct(a)}</td>
 <td class="text-end fw-bold">${esc(items[i]?.paidProgressive??'N/A')}</td>
 </tr>`;
 }).join('');

 return tableWrap(headers,rows);
}

function renderTrend(title,items){
 const months=globalData.months;

 showDetail(`
 ${heading('📈 รายงานพัฒนาการรายเดือน',title)}

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">📈 Monthly Top-up Trend</h6>
 <div class="chart-container-box"><canvas id="topupTrend"></canvas></div>
 </div>

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">
 👥 Age 40+ vs Progressive-Related Top-up
 </h6>
 <div class="chart-container-box"><canvas id="ageTrend"></canvas></div>
 <p class="note-text mt-3 mb-0">
 Age 40+ is customer age distribution, not Progressive conversion.
 </p></div>

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">📊 Monthly Performance</h6>
 ${tableWrap([...metricHeaders('เดือน'),'Age 40+ (%)'],trendRows(items))}
 </div>

 <div class="card card-custom p-3 p-md-4">
 <h6 class="fw-bold text-warning mb-3">👥 Customer Age Distribution</h6>
 ${ageMonthlyTable(items)}
 </div>`);

 makeChart('topupTrend',months,[
 {label:'Standard Package Total (%)',
 data:items.map(x=>x?.raw?.freeTotal??null)},
 {label:'Top-up Total (%)',
 data:items.map(x=>x?.raw?.paidTotal??null)}
 ]);

 makeChart('ageTrend',months,[
 {label:'Age 40+ (%)',
 data:items.map(x=>x?.age?.total?x.age.age40PlusPct:null)},
 {label:'Progressive-Related Top-up (%)',
 data:items.map(x=>x?.raw?.paidProgressive??null)}
 ]);
}

function openBranchDetail(branch){
 const data=globalData.branchDataMap[branch]||{};
 const items=globalData.months.map(m=>data[m]||null);
 el('branchSelect').value=branch;
 renderTrend('🏪 สาขา: '+branch,items);
}

function openAreaTrendDetail(area){
 const items=globalData.months.map(m=>{
 const g=(globalData.dataMap[m]||{})[area];
 return g?{...g.summary,age:g.age}:null;
 });
 el('areaSelect2').value=area;
 renderTrend('🏢 Area: '+area,items);
}

/* ALL STORES + RANKING */

function switchRankMonth(month){
 selectedRankMonth=month;
 renderAllStoresInline();
}

function renderAllStoresInline(){
 cleanupCharts();

 const months=globalData.months;
 const month=selectedRankMonth;
 const avg=globalData.monthlyAverages[month]||{};
 const age=globalData.monthlyAge[month]||blankAge();
 const ranking=globalData.monthlyRanking[month]||[];

 const buttons=`
 <div class="month-btn-group mb-4">
 ${months.map(m=>`
 <button class="btn ${m===month?'btn-orange-active':'btn-orange-outline'}"
 data-rank-month="${esc(m)}">📅 ${esc(m)}</button>
 `).join('')}
 </div>`;

 const rows=ranking.map((b,i)=>`
 <tr>
 <td class="text-center">
 <span class="badge-rank ${i<3?'rank-'+(i+1):''}">${i+1}</span>
 </td>
 <td class="branch-name-cell">
 <span class="branch-clickable" data-branch="${esc(b.name)}">${esc(b.name)}</span>
 <small class="area-clickable" data-area="${esc(b.area)}">(${esc(b.area)})</small>
 </td>
 ${metricCells(b)}
 <td class="text-end fw-bold">${agePct(b.age)}</td>
 </tr>`).join('');

 const items=months.map(m=>({
 ...(globalData.monthlyAverages[m]||{}),
 age:globalData.monthlyAge[m]||blankAge()
 }));

 el('all-stores-container').innerHTML=`
 ${heading('📊 ภาพรวมระบบ','ข้อมูลรวมทุกสาขา & Ranking (Top-up Total)')}
 ${buttons}

 <div class="card card-custom p-3 mb-4">
 <h6 class="fw-bold text-warning mb-3">📊 Average Percentage — ${esc(month)}</h6>
 ${statCards(avg)}
 </div>

 ${ageCards(age,avg.paidProgressive)}

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">📈 Monthly Average Top-up Trend</h6>
 <div class="chart-container-box"><canvas id="allStoresChart"></canvas></div>
 </div>

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">
 📈 Age 40+ vs Progressive-Related Top-up
 </h6>
 <div class="chart-container-box"><canvas id="allAgeChart"></canvas></div>
 </div>

 <div class="card card-custom p-3 p-md-4 mb-4">
 <h6 class="fw-bold text-warning mb-3">
 👥 Customer Age Distribution (All Months)
 </h6>
 ${ageMonthlyTable(items)}
 </div>

 <div class="card card-custom p-3 p-md-4">
 <h6 class="fw-bold text-warning mb-3">🏆 Ranking — ${esc(month)}</h6>
 ${tableWrap(['อันดับ',...metricHeaders('สาขา (Area)'),'Age 40+ (%)'],rows)}
 </div>`;

 makeChart('allStoresChart',months,[
 {label:'Standard Package Total Avg (%)',
 data:items.map(x=>x.raw?.freeTotal??null)},
 {label:'Top-up Total Avg (%)',
 data:items.map(x=>x.raw?.paidTotal??null)}
 ]);

 makeChart('allAgeChart',months,[
 {label:'Age 40+ (%)',
 data:items.map(x=>x.age?.total?x.age.age40PlusPct:null)},
 {label:'Progressive-Related Top-up Avg (%)',
 data:items.map(x=>x.raw?.paidProgressive??null)}
 ]);
}

/* CLICK HANDLERS */

document.addEventListener('click',function(e){
 const branch=e.target.closest('[data-branch]');
 if(branch){
 openBranchDetail(branch.dataset.branch);
 return;
 }

 const area=e.target.closest('[data-area]');
 if(area){
 openAreaTrendDetail(area.dataset.area);
 return;
 }

 const month=e.target.closest('[data-rank-month]');
 if(month) switchRankMonth(month.dataset.rankMonth);
});

/* START APPLICATION */

window.addEventListener('load',loadDashboard);

</script>
</body>
</html>
