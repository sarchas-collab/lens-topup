<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Lens Top-up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lens Top-up">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* กำหนดฟอนต์ Founders Grotesk */
    @font-face {
      font-family: 'Founders Grotesk';
      src: local('Founders Grotesk'), local('FoundersGrotesk-Regular');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Founders Grotesk';
      src: local('Founders Grotesk Bold'), local('FoundersGrotesk-Bold');
      font-weight: 700;
      font-style: normal;
    }

    body {
      font-family: 'Founders Grotesk', 'Helvetica Neue', Arial, sans-serif;
      background-color: #0d1117;
      color: #f0f6fc;
      letter-spacing: 0.02em;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    .navbar-custom { padding-top: calc(env(safe-area-inset-top) + 0.5rem) !important; position: sticky; top: 0; z-index: 1000; }
    .btn-refresh {
      background: #21262d; color: #f0f6fc; border: 1px solid #30363d;
      border-radius: 10px; width: 40px; height: 40px; font-size: 1.1rem;
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    .btn-refresh:active { background: #30363d; }
    .btn-refresh.spinning span { display: inline-block; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .update-bar { font-size: 0.75rem; color: #8b949e; text-align: center; margin: -6px 0 10px; }
    .update-bar.offline { color: #fbbf24; }
    .navbar-custom {
      background: linear-gradient(135deg, #161b22, #0d1117);
      color: white;
      border-bottom: 2px solid #f97316;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2);
    }
    .card-filter {
      border: 1px solid #30363d;
      border-radius: 16px;
      background: #161b22;
      color: #f0f6fc;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .card-custom {
      border: 1px solid #30363d;
      border-radius: 16px;
      background: #161b22;
      color: #f0f6fc;
    }
    .form-select-custom {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      background-color: #21262d;
      color: #ffffff;
      border: 1.5px solid #30363d;
      font-weight: 600;
      font-family: inherit;
    }
    .form-select-custom:focus {
      background-color: #21262d;
      color: #ffffff;
      border-color: #f97316;
      box-shadow: 0 0 0 0.25rem rgba(249, 115, 22, 0.25);
    }
    .btn-submit {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.05rem;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #ffffff;
    }
    .btn-back {
      background-color: #21262d;
      color: #f0f6fc;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #30363d;
      font-family: inherit;
    }
    .btn-back:hover {
      background-color: #30363d;
      color: #ffffff;
    }
    
    /* ปรับแต่ง แท็บเมนู สำหรับมือถือ */
    .nav-tabs-custom {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .nav-tabs-custom .nav-item {
      flex: 1 1 auto;
      text-align: center;
    }
    .nav-tabs-custom .nav-link {
      font-weight: 700;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      background-color: #161b22;
      font-family: inherit;
      width: 100%;
      white-space: nowrap;
    }
    .nav-tabs-custom .nav-link.active {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      border-color: #f97316;
    }

    /* สวิตช์ปุ่มเลือกเดือนให้เลื่อนดูบนมือถือได้สะดวก */
    .month-btn-group {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
      gap: 4px;
    }
    .month-btn-group .btn {
      flex: 0 0 auto;
      font-size: 0.85rem;
      padding: 8px 12px;
    }

    .btn-orange-outline {
      border: 1px solid #f97316;
      color: #f97316;
      background-color: transparent;
      font-weight: 700;
      font-family: inherit;
    }
    .btn-orange-outline:hover {
      background-color: #f97316;
      color: #ffffff;
    }
    .btn-orange-active {
      background-color: #f97316 !important;
      color: #ffffff !important;
      font-weight: 700;
      border-color: #f97316 !important;
      font-family: inherit;
    }
    .badge-rank {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .rank-1 { background-color: #fef08a; color: #854d0e; }
    .rank-2 { background-color: #e2e8f0; color: #1e293b; }
    .rank-3 { background-color: #ffedd5; color: #9a3412; }
    
    /* สไตล์ตาราง High Contrast + รองรับการเลื่อนบนมือถือ */
    .table-responsive-custom {
      background-color: #ffffff;
      border-radius: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-custom {
      background-color: #ffffff;
      color: #0f172a;
      margin-bottom: 0;
      font-family: inherit;
      min-width: 680px; /* บังคับขนาดตารางขั้นต่ำไม่ให้เบียดกันเกินไป */
    }
    .table-custom thead {
      background-color: #0f172a;
      color: #f59e0b;
      font-size: 0.85rem;
    }
    .table-custom thead th {
      padding: 12px 8px;
      font-weight: 700;
      border: none;
      white-space: nowrap;
    }
    .table-custom tbody tr {
      border-bottom: 1px solid #e2e8f0;
    }
    .table-custom tbody tr:hover {
      background-color: #f8fafc;
    }
    .table-custom tbody td {
      padding: 10px 8px;
      font-size: 0.9rem;
    }
    .branch-name-cell {
      color: #0f172a !important;
      font-weight: 700 !important;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    
    .branch-clickable {
      color: #0284c7 !important;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease-in-out;
    }
    .branch-clickable:hover {
      color: #ea580c !important;
    }
    .area-clickable {
      color: #d97706 !important;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease-in-out;
    }
    .area-clickable:hover {
      color: #ea580c !important;
    }

    /* ปรับปรุง Stat Card บนหน้าจอมือถือ */
    .stat-card-box {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 4px;
      height: 100%;
    }
    .stat-card-box .label-title {
      color: #fbbf24;
      font-weight: 600;
      font-size: 0.72rem;
      display: block;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-card-box .val-num {
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
    }
    .stat-card-box.highlight-card {
      background-color: #1c2d27;
      border: 1px solid #22c55e;
    }
    .stat-card-box.highlight-card .label-title {
      color: #4ade80;
    }
    .stat-card-box.highlight-card .val-num {
      color: #22c55e;
    }

    .chart-container-box {
      position: relative;
      height: 300px;
      width: 100%;
    }

    /* สไตล์เจาะจงสำหรับมือถือ */
    @media (max-width: 576px) {
      .navbar-brand {
        font-size: 1.05rem !important;
      }
      .card-filter, .card-custom {
        padding: 1rem !important;
        border-radius: 12px;
      }
      .chart-container-box {
        height: 250px;
      }
      .nav-tabs-custom .nav-link {
        font-size: 0.8rem;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-custom py-2 py-md-3 mb-3 mb-md-4">
  <div class="container px-3 d-flex align-items-center justify-content-between flex-nowrap">
    <span class="navbar-brand mb-0 h1 text-white fw-bold text-truncate">📊 Lens Top-up Analytics & Performance</span>
    <button type="button" id="btn-refresh" class="btn-refresh" onclick="refreshData(true)" title="ดึงข้อมูลล่าสุด" aria-label="ดึงข้อมูลล่าสุด"><span>🔄</span></button>
  </div>
</nav>

<div class="container px-2 px-sm-3 pb-5">
  <div id="update-bar" class="update-bar"></div>
  <div id="loading-spinner" class="text-center py-5">
    <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
    <h5 class="mt-3 text-light fs-6 fs-md-5">กำลังโหลดข้อมูลระบบ...</h5>
  </div>

  <!-- หน้าแรก: แท็บเลือกโหมด -->
  <div id="home-view" style="display: none;">
    <div class="row justify-content-center py-1 py-md-2">
      <div class="col-12 col-md-11 col-lg-10">
        
        <ul class="nav nav-pills nav-tabs-custom justify-content-center mb-3 mb-md-4 p-2 rounded-3 shadow-sm" style="background-color: #161b22;">
          <li class="nav-item">
            <button class="nav-link active" id="tab-month-area" onclick="switchMode('month-area')">📅 รายเดือน + Area</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-branch" onclick="switchMode('branch')">🏪 รายสาขา (Branch Trend)</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-area" onclick="switchMode('area')">🏢 ราย Area (Area Trend)</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-all-stores" onclick="switchMode('all-stores')">📊 รวมทุกสาขา & Ranking</button>
          </li>
        </ul>

        <!-- โหมด 1: เลือกเดือน + Area -->
        <div id="form-month-area" class="card card-filter p-3 p-md-5 mx-auto" style="max-width: 650px;">
          <form onsubmit="handleMonthAreaSubmit(event)">
            <h5 class="fw-bold text-center mb-3 mb-md-4 text-warning">🔍 ดูข้อมูลย่อย Area ประจำเดือน</h5>
            <div class="mb-3 mb-md-4">
              <label class="form-label fw-semibold text-light small">📅 เลือกเดือน (Month)</label>
              <select class="form-select form-select-custom" id="monthSelect" required></select>
            </div>
            <div class="mb-3 mb-md-4">
              <label class="form-label fw-semibold text-light small">🏢 เลือก Area</label>
              <select class="form-select form-select-custom" id="areaSelect1" required></select>
            </div>
            <button type="submit" class="btn btn-submit w-100 mt-2">🚀 เข้าดูข้อมูลย่อย</button>
          </form>
        </div>

        <!-- โหมด 2: เลือกสาขา (Branch Trend) -->
        <div id="form-branch" class="card card-filter p-3 p-md-5 mx-auto" style="display: none; max-width: 650px;">
          <form onsubmit="handleBranchSubmit(event)">
            <h5 class="fw-bold text-center mb-3 mb-md-4 text-warning">📈 ดูพัฒนาการรายสาขา</h5>
            <div class="mb-3 mb-md-4">
              <label class="form-label fw-semibold text-light small">🏪 เลือกสาขา (Branch)</label>
              <select class="form-select form-select-custom" id="branchSelect" required></select>
            </div>
            <button type="submit" class="btn btn-submit w-100 mt-2">📊 ดูตัวเลขแยกตามเดือน & กราฟพัฒนาการ</button>
          </form>
        </div>

        <!-- โหมด 3: เลือก Area (Area Trend) -->
        <div id="form-area" class="card card-filter p-3 p-md-5 mx-auto" style="display: none; max-width: 650px;">
          <form onsubmit="handleAreaSubmit(event)">
            <h5 class="fw-bold text-center mb-3 mb-md-4 text-warning">📈 ดูพัฒนาการราย Area</h5>
            <div class="mb-3 mb-md-4">
              <label class="form-label fw-semibold text-light small">🏢 เลือก Area</label>
              <select class="form-select form-select-custom" id="areaSelect2" required></select>
            </div>
            <button type="submit" class="btn btn-submit w-100 mt-2">📊 ดูตัวเลขแยกตามเดือน & กราฟพัฒนาการ</button>
          </form>
        </div>

        <!-- โหมด 4: รวมทุกสาขา & Ranking -->
        <div id="form-all-stores" style="display: none;">
          <div id="all-stores-container"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- หน้ารายละเอียดสำหรับโหมด 1, 2, 3 -->
  <div id="detail-view" style="display: none;">
    <button class="btn btn-back mb-3 mb-md-4 px-3 px-md-4 btn-sm fs-6" onclick="showHomeView()">⬅️ กลับหน้าเลือกข้อมูล</button>
    <div id="detail-content"></div>
  </div>
</div>

<script>
  let globalData = {};
  let currentChart = null;
  let allStoresChart = null;
  let selectedRankMonth = "APR2026";

  Chart.defaults.font.family = "'Founders Grotesk', 'Helvetica Neue', Arial, sans-serif";

  // ================== ตั้งค่า (แก้ 2 บรรทัดนี้) ==================
  const API_URL = 'https://script.google.com/macros/s/ใส่_DEPLOYMENT_ID_ตรงนี้/exec';
  const API_KEY = 'lens-2026-change-me'; // ต้องตรงกับ API_KEY ใน Code.gs
  // =============================================================

  const STORAGE_KEY = 'lens_dash_v1';
  let dashboardReady = false;
  let isFetching = false;

  window.addEventListener('load', function() {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

    if (cached && cached.data) {
      initDashboard(cached.data);          // แสดงข้อมูลในเครื่องทันที
      setUpdateBar(cached.updatedAt, false);
    }
    refreshData(false);                    // แล้วดึงข้อมูลใหม่เบื้องหลัง

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  });

  // ดึงข้อมูลใหม่อีกครั้งเมื่อผู้ใช้กลับมาเปิดแอป (เกิน 10 นาที)
  let lastFetch = 0;
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && Date.now() - lastFetch > 10 * 60 * 1000) {
      refreshData(false);
    }
  });

  async function refreshData(force) {
    if (isFetching) return;
    isFetching = true;
    lastFetch = Date.now();
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('spinning');

    try {
      const url = API_URL + '?key=' + encodeURIComponent(API_KEY) + (force ? '&refresh=1' : '') + '&t=' + Date.now();
      const res = await fetch(url, { redirect: 'follow' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error === 'unauthorized' ? 'API_KEY ไม่ถูกต้อง' : json.error);

      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ updatedAt: json.updatedAt, data: json.data })); } catch (e) {}

      if (!dashboardReady) {
        initDashboard(json.data);
      } else {
        applyFreshData(json.data);
      }
      setUpdateBar(json.updatedAt, false);
    } catch (err) {
      if (!dashboardReady) {
        document.getElementById('loading-spinner').innerHTML =
          `<div class="alert alert-danger">❌ โหลดข้อมูลไม่สำเร็จ: ${err.message}<br><small>ตรวจสอบอินเทอร์เน็ต แล้วกดปุ่ม 🔄 ด้านบนเพื่อลองใหม่</small></div>`;
      } else {
        const bar = document.getElementById('update-bar');
        bar.classList.add('offline');
        bar.textContent = '⚠️ ออฟไลน์ — กำลังแสดงข้อมูลที่บันทึกไว้ในเครื่อง';
      }
    } finally {
      isFetching = false;
      btn.classList.remove('spinning');
    }
  }

  function setUpdateBar(iso, offline) {
    const bar = document.getElementById('update-bar');
    bar.classList.toggle('offline', !!offline);
    if (!iso) { bar.textContent = ''; return; }
    const d = new Date(iso);
    bar.textContent = 'อัปเดตข้อมูลล่าสุด: ' + d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function initDashboard(data) {
    globalData = data;
    selectedRankMonth = globalData.months[0] || "APR2026";
    document.getElementById('loading-spinner').style.display = 'none';
    document.getElementById('home-view').style.display = 'block';
    populateDropdowns();
    dashboardReady = true;
  }

  // อัปเดตข้อมูลใหม่โดยไม่รีเซ็ตหน้าที่ผู้ใช้กำลังดู
  function applyFreshData(data) {
    globalData = data;
    if (globalData.months.indexOf(selectedRankMonth) === -1) {
      selectedRankMonth = globalData.months[0] || selectedRankMonth;
    }
    populateDropdowns();
    if (document.getElementById('form-all-stores').style.display === 'block' &&
        document.getElementById('home-view').style.display === 'block') {
      renderAllStoresInline();
    }
  }

  function switchMode(mode) {
    const tabs = ['month-area', 'branch', 'area', 'all-stores'];
    tabs.forEach(t => {
      document.getElementById(`tab-${t}`).classList.remove('active');
      document.getElementById(`form-${t}`).style.display = 'none';
    });

    document.getElementById(`tab-${mode}`).classList.add('active');
    document.getElementById(`form-${mode}`).style.display = 'block';

    if (mode === 'all-stores') {
      renderAllStoresInline();
    }
  }

  function populateDropdowns() {
    const monthSelect = document.getElementById('monthSelect');
    const areaSelect1 = document.getElementById('areaSelect1');
    const areaSelect2 = document.getElementById('areaSelect2');
    const branchSelect = document.getElementById('branchSelect');

    const prev = [monthSelect.value, areaSelect1.value, areaSelect2.value, branchSelect.value];
    [monthSelect, areaSelect1, areaSelect2, branchSelect].forEach(sel => { sel.options.length = 0; });

    globalData.months.forEach((m, i) => {
      monthSelect.options.add(new Option(`เดือน ${m}`, m, i === 0, i === 0));
    });

    globalData.areas.forEach((a, i) => {
      areaSelect1.options.add(new Option(`Area: ${a}`, a, i === 0, i === 0));
      areaSelect2.options.add(new Option(`Area: ${a}`, a, i === 0, i === 0));
    });

    globalData.branchesList.forEach((b, i) => {
      branchSelect.options.add(new Option(`สาขา: ${b}`, b, i === 0, i === 0));
    });

    [monthSelect, areaSelect1, areaSelect2, branchSelect].forEach((sel, idx) => {
      if (prev[idx] && Array.from(sel.options).some(o => o.value === prev[idx])) sel.value = prev[idx];
    });
  }

  function handleMonthAreaSubmit(e) {
    e.preventDefault();
    openMonthAreaDetail(document.getElementById('monthSelect').value, document.getElementById('areaSelect1').value);
  }

  function handleBranchSubmit(e) {
    e.preventDefault();
    openBranchDetail(document.getElementById('branchSelect').value);
  }

  function handleAreaSubmit(e) {
    e.preventDefault();
    openAreaTrendDetail(document.getElementById('areaSelect2').value);
  }

  function renderAllStoresInline() {
    let chartLabels = [];
    let freeTotalAvgData = [];
    let paidTotalAvgData = [];

    globalData.months.forEach(m => {
      const avgObj = globalData.monthlyAverages[m] || { raw: { freeTotal: 0, paidTotal: 0 } };
      chartLabels.push(m);
      freeTotalAvgData.push(avgObj.raw.freeTotal);
      paidTotalAvgData.push(avgObj.raw.paidTotal);
    });

    let monthBtnHtml = '<div class="month-btn-group mb-3 mb-md-4">';
    globalData.months.forEach(m => {
      const activeClass = (m === selectedRankMonth) ? 'btn-orange-active' : 'btn-orange-outline';
      monthBtnHtml += `<button type="button" class="btn ${activeClass}" onclick="switchRankMonth('${m}')">📅 ${m}</button>`;
    });
    monthBtnHtml += '</div>';

    const currentAvg = globalData.monthlyAverages[selectedRankMonth] || {
      freeSingle: '0.00%', freeTotal: '0.00%', paidProgressive: '0.00%', paidSingle: '0.00%', paidTotal: '0.00%'
    };

    const rankList = globalData.monthlyRanking[selectedRankMonth] || [];
    let rankTableRows = '';

    if (rankList.length === 0) {
      rankTableRows = `<tr><td colspan="7" class="text-center py-3 text-muted">ไม่มีข้อมูลจัดอันดับในเดือนนี้</td></tr>`;
    } else {
      rankList.forEach((b, idx) => {
        let rankBadgeClass = 'bg-secondary text-light';
        if (idx === 0) rankBadgeClass = 'rank-1';
        else if (idx === 1) rankBadgeClass = 'rank-2';
        else if (idx === 2) rankBadgeClass = 'rank-3';

        const areaLabelHtml = b.area ? ` (<span class="area-clickable" onclick="openAreaTrendDetail('${escapeHtml(b.area)}')" title="คลิกเพื่อดูแนวโน้มของ Area ${b.area}">${b.area}</span>)` : '';

        rankTableRows += `
          <tr>
            <td class="text-center"><span class="badge-rank ${rankBadgeClass}">${idx + 1}</span></td>
            <td class="branch-name-cell py-2 py-md-3">
              <span class="branch-clickable" onclick="openBranchDetail('${escapeHtml(b.name)}')" title="คลิกเพื่อดูพัฒนาการของสาขานี้">
                ${b.name}
              </span>
              ${areaLabelHtml}
            </td>
            <td class="text-end fw-semibold">${b.freeSingle}</td>
            <td class="text-end fw-bold text-warning">${b.freeTotal}</td>
            <td class="text-end fw-semibold">${b.paidProgressive}</td>
            <td class="text-end fw-semibold">${b.paidSingle}</td>
            <td class="text-end fw-bold text-success fs-6">${b.paidTotal}</td>
          </tr>`;
      });
    }

    const html = `
      <div class="card card-custom p-3 p-md-4 mb-3 mb-md-4" style="background: linear-gradient(135deg, #161b22, #0d1117); border-left: 5px solid #f97316;">
        <span class="badge bg-warning text-dark mb-2 fs-6 align-self-start fw-bold">📊 ภาพรวมระบบ</span>
        <h4 class="fw-bold m-0 text-white fs-5 fs-md-3">ข้อมูลรวมทุกสาขา & อันดับพัฒนาการ (Top-up Total)</h4>
      </div>

      ${monthBtnHtml}

      <div class="card card-custom p-3 mb-3 mb-md-4">
        <h6 class="fw-bold text-warning mb-2 mb-md-3 small">📊 ค่าเฉลี่ยภาพรวมทุกสาขา (Average Percentage) ประจำเดือน ${selectedRankMonth}</h6>
        <div class="row g-2 text-center row-cols-2 row-cols-sm-3 row-cols-md-5">
          <div class="col"><div class="stat-card-box"><span class="label-title">Standard Package</span><span class="val-num">${currentAvg.freeSingle}</span></div></div>
          <div class="col"><div class="stat-card-box"><span class="label-title" style="color: #f59e0b;">Standard Package Total</span><span class="val-num" style="color: #f59e0b;">${currentAvg.freeTotal}</span></div></div>
          <div class="col"><div class="stat-card-box"><span class="label-title">Progressive-Related Top-up</span><span class="val-num">${currentAvg.paidProgressive}</span></div></div>
          <div class="col"><div class="stat-card-box"><span class="label-title">Single Vision-Related Top-up</span><span class="val-num">${currentAvg.paidSingle}</span></div></div>
          <div class="col col-12 col-sm-6 col-md-2"><div class="stat-card-box highlight-card"><span class="label-title">Top-up Total</span><span class="val-num">${currentAvg.paidTotal}</span></div></div>
        </div>
      </div>

      <div class="card card-custom p-3 p-md-4 mb-3 mb-md-4">
        <h6 class="fw-bold text-warning mb-3 small">📈 กราฟแนวโน้มค่าเฉลี่ยพัฒนาการรวมทุกสาขา (Monthly Avg Trend)</h6>
        <div class="chart-container-box">
          <canvas id="allStoresChart"></canvas>
        </div>
      </div>

      <div class="card card-custom p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold text-warning m-0 small">🏆 จัดอันดับสาขาที่มี Top-up Total สูงสุดประจำเดือน (${selectedRankMonth})</h6>
        </div>

        <div class="table-responsive table-responsive-custom">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th class="text-center" style="width: 60px;">อันดับ</th>
                <th>สาขา (Area)</th>
                <th class="text-end">Standard Package</th>
                <th class="text-end">Standard Package Total</th>
                <th class="text-end">Progressive-Related Top-up</th>
                <th class="text-end">Single Vision-Related Top-up</th>
                <th class="text-end" style="color: #10b981;">Top-up Total</th>
              </tr>
            </thead>
            <tbody>${rankTableRows}</tbody>
          </table>
        </div>
      </div>`;

    document.getElementById('all-stores-container').innerHTML = html;

    setTimeout(() => {
      const ctx = document.getElementById('allStoresChart').getContext('2d');
      if (allStoresChart) allStoresChart.destroy();

      allStoresChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chartLabels,
          datasets: [
            {
              label: 'Standard Package Total Avg (%)',
              data: freeTotalAvgData,
              borderColor: '#f97316',
              backgroundColor: 'rgba(249, 115, 22, 0.15)',
              fill: true,
              tension: 0.3,
              borderWidth: 2
            },
            {
              label: 'Top-up Total Avg (%)',
              data: paidTotalAvgData,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.15)',
              fill: true,
              tension: 0.3,
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: 'top',
              labels: { color: '#f0f6fc', font: { weight: 'bold', size: 11 } }
            } 
          },
          scales: {
            x: { ticks: { color: '#8b949e', font: { weight: 'bold', size: 10 } }, grid: { color: '#21262d' } },
            y: {
              beginAtZero: true,
              ticks: { color: '#8b949e', font: { weight: 'bold', size: 10 }, callback: value => value + '%' },
              grid: { color: '#21262d' }
            }
          }
        }
      });
    }, 100);
  }

  function switchRankMonth(month) {
    selectedRankMonth = month;
    renderAllStoresInline();
  }

  function escapeHtml(str) {
    return String(str).replace(/'/g, "\\'");
  }

  // 1. View: เดือน + Area
  function openMonthAreaDetail(month, area) {
    showDetailView();

    const monthMap = globalData.dataMap[month] || {};
    const areaDetail = monthMap[area];

    let contentHtml = '';

    if (!areaDetail) {
      contentHtml = `<div class="alert alert-warning text-center py-4">ไม่พบข้อมูลของ Area <strong>${area}</strong> ในเดือน <strong>${month}</strong></div>`;
    } else {
      let rowsHtml = '';
      if (areaDetail.branches && areaDetail.branches.length > 0) {
        areaDetail.branches.forEach(b => {
          rowsHtml += `
            <tr>
              <td class="branch-name-cell py-2 py-md-3">
                <span class="branch-clickable" onclick="openBranchDetail('${escapeHtml(b.name)}')" title="คลิกเพื่อดูพัฒนาการของสาขานี้">
                  ${b.name}
                </span>
              </td>
              <td class="text-end fw-semibold">${b.freeSingle}</td>
              <td class="text-end fw-bold text-warning">${b.freeTotal}</td>
              <td class="text-end fw-semibold">${b.paidProgressive}</td>
              <td class="text-end fw-semibold">${b.paidSingle}</td>
              <td class="text-end fw-bold text-success fs-6">${b.paidTotal}</td>
            </tr>`;
        });
      } else {
        rowsHtml = `
          <tr>
            <td class="branch-name-cell py-2 py-md-3">${area} (ภาพรวม)</td>
            <td class="text-end fw-semibold">${areaDetail.summary.freeSingle || '0.00%'}</td>
            <td class="text-end fw-bold text-warning">${areaDetail.summary.freeTotal || '0.00%'}</td>
            <td class="text-end fw-semibold">${areaDetail.summary.paidProgressive || '0.00%'}</td>
            <td class="text-end fw-semibold">${areaDetail.summary.paidSingle || '0.00%'}</td>
            <td class="text-end fw-bold text-success fs-6">${areaDetail.summary.paidTotal || '0.00%'}</td>
          </tr>`;
      }

      contentHtml = `
        <div class="card card-custom p-3 p-md-4 mb-3 mb-md-4" style="background: linear-gradient(135deg, #161b22, #0d1117); border-left: 5px solid #f97316;">
          <span class="badge bg-warning text-dark mb-2 fs-6 align-self-start fw-bold">📅 ประจำเดือน: ${month}</span>
          <h3 class="fw-bold m-0 text-white fs-4 fs-md-2">🏢 Area: ${area}</h3>
        </div>

        <div class="card card-custom p-3 mb-3 mb-md-4">
          <h6 class="fw-bold text-warning mb-2 mb-md-3 small">📊 สรุปภาพรวม Area (${month})</h6>
          <div class="row g-2 text-center row-cols-2 row-cols-sm-3 row-cols-md-5">
            <div class="col"><div class="stat-card-box"><span class="label-title">Standard Package</span><span class="val-num">${areaDetail.summary.freeSingle || '0.00%'}</span></div></div>
            <div class="col"><div class="stat-card-box"><span class="label-title" style="color: #f59e0b;">Standard Package Total</span><span class="val-num" style="color: #f59e0b;">${areaDetail.summary.freeTotal || '0.00%'}</span></div></div>
            <div class="col"><div class="stat-card-box"><span class="label-title">Progressive-Related Top-up</span><span class="val-num">${areaDetail.summary.paidProgressive || '0.00%'}</span></div></div>
            <div class="col"><div class="stat-card-box"><span class="label-title">Single Vision-Related Top-up</span><span class="val-num">${areaDetail.summary.paidSingle || '0.00%'}</span></div></div>
            <div class="col col-12 col-sm-6 col-md-2"><div class="stat-card-box highlight-card"><span class="label-title">Top-up Total</span><span class="val-num">${areaDetail.summary.paidTotal || '0.00%'}</span></div></div>
          </div>
        </div>

        <div class="card card-custom p-3 p-md-4">
          <h6 class="fw-bold text-warning mb-3 small">📍 ข้อมูลตัวเลขย่อย (${month})</h6>
          <div class="table-responsive table-responsive-custom">
            <table class="table table-custom align-middle">
              <thead>
                <tr><th>สาขา / รายการ</th><th class="text-end">Standard Package</th><th class="text-end">Standard Package Total</th><th class="text-end">Progressive-Related Top-up</th><th class="text-end">Single Vision-Related Top-up</th><th class="text-end" style="color: #10b981;">Top-up Total</th></tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>`;
    }
    document.getElementById('detail-content').innerHTML = contentHtml;
    window.scrollTo(0, 0);
  }

  // 2. View: สาขา + กราฟพัฒนาการ
  function openBranchDetail(branch) {
    showDetailView();

    const branchSelect = document.getElementById('branchSelect');
    if (branchSelect) {
      branchSelect.value = branch;
    }

    const branchData = globalData.branchDataMap[branch] || {};
    let tableRows = '';
    let chartLabels = [];
    let freeTotalData = [];
    let paidTotalData = [];

    globalData.months.forEach(m => {
      const item = branchData[m] || { freeSingle: '-', freeTotal: '-', paidProgressive: '-', paidSingle: '-', paidTotal: '-', raw: { freeTotal: 0, paidTotal: 0 } };
      
      tableRows += `
        <tr>
          <td class="branch-name-cell py-2 py-md-3">📅 เดือน ${m}</td>
          <td class="text-end fw-semibold">${item.freeSingle}</td>
          <td class="text-end fw-bold text-warning">${item.freeTotal}</td>
          <td class="text-end fw-semibold">${item.paidProgressive}</td>
          <td class="text-end fw-semibold">${item.paidSingle}</td>
          <td class="text-end fw-bold text-success fs-6">${item.paidTotal}</td>
        </tr>`;

      chartLabels.push(m);
      freeTotalData.push(item.raw ? item.raw.freeTotal : 0);
      paidTotalData.push(item.raw ? item.raw.paidTotal : 0);
    });

    renderTrendView(`🏪 สาขา: ${branch}`, tableRows, chartLabels, freeTotalData, paidTotalData);
  }

  // 3. View: Area + กราฟพัฒนาการ
  function openAreaTrendDetail(area) {
    showDetailView();

    const areaSelect2 = document.getElementById('areaSelect2');
    if (areaSelect2) {
      areaSelect2.value = area;
    }

    let tableRows = '';
    let chartLabels = [];
    let freeTotalData = [];
    let paidTotalData = [];

    globalData.months.forEach(m => {
      const mData = (globalData.dataMap[m] || {})[area];
      const summary = mData ? mData.summary : { freeSingle: '-', freeTotal: '-', paidProgressive: '-', paidSingle: '-', paidTotal: '-', raw: { freeTotal: 0, paidTotal: 0 } };

      tableRows += `
        <tr>
          <td class="branch-name-cell py-2 py-md-3">📅 เดือน ${m}</td>
          <td class="text-end fw-semibold">${summary.freeSingle || '-'}</td>
          <td class="text-end fw-bold text-warning">${summary.freeTotal || '-'}</td>
          <td class="text-end fw-semibold">${summary.paidProgressive || '-'}</td>
          <td class="text-end fw-semibold">${summary.paidSingle || '-'}</td>
          <td class="text-end fw-bold text-success fs-6">${summary.paidTotal || '-'}</td>
        </tr>`;

      chartLabels.push(m);
      freeTotalData.push(summary.raw ? summary.raw.freeTotal : 0);
      paidTotalData.push(summary.raw ? summary.raw.paidTotal : 0);
    });

    renderTrendView(`🏢 Area: ${area}`, tableRows, chartLabels, freeTotalData, paidTotalData);
  }

  function renderTrendView(title, tableRows, chartLabels, freeTotalData, paidTotalData) {
    const contentHtml = `
      <div class="card card-custom p-3 p-md-4 mb-3 mb-md-4" style="background: linear-gradient(135deg, #161b22, #0d1117); border-left: 5px solid #f97316;">
        <span class="badge bg-warning text-dark mb-2 fs-6 align-self-start fw-bold">📈 รายงานพัฒนาการรายเดือน</span>
        <h3 class="fw-bold m-0 text-white fs-4 fs-md-2">${title}</h3>
      </div>

      <div class="card card-custom p-3 p-md-4 mb-3 mb-md-4">
        <h6 class="fw-bold text-warning mb-3 small">📈 กราฟแสดงแนวโน้มพัฒนาการ (Monthly Trend)</h6>
        <div class="chart-container-box">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="card card-custom p-3 p-md-4">
        <h6 class="fw-bold text-warning mb-3 small">📊 สรุปตัวเลขแยกตามเดือน (${globalData.months[0]} - ${globalData.months[globalData.months.length - 1]})</h6>
        <div class="table-responsive table-responsive-custom">
          <table class="table table-custom align-middle">
            <thead>
              <tr><th>เดือน</th><th class="text-end">Standard Package</th><th class="text-end">Standard Package Total</th><th class="text-end">Progressive-Related Top-up</th><th class="text-end">Single Vision-Related Top-up</th><th class="text-end" style="color: #10b981;">Top-up Total</th></tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>`;

    document.getElementById('detail-content').innerHTML = contentHtml;
    window.scrollTo(0, 0);

    setTimeout(() => {
      const ctx = document.getElementById('trendChart').getContext('2d');
      if (currentChart) currentChart.destroy();

      currentChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chartLabels,
          datasets: [
            {
              label: 'Standard Package Total (%)',
              data: freeTotalData,
              borderColor: '#f97316',
              backgroundColor: 'rgba(249, 115, 22, 0.15)',
              fill: true,
              tension: 0.3,
              borderWidth: 2
            },
            {
              label: 'Top-up Total (%)',
              data: paidTotalData,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.15)',
              fill: true,
              tension: 0.3,
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: 'top',
              labels: { color: '#f0f6fc', font: { weight: 'bold', size: 11 } }
            } 
          },
          scales: {
            x: { ticks: { color: '#8b949e', font: { weight: 'bold', size: 10 } }, grid: { color: '#21262d' } },
            y: {
              beginAtZero: true,
              ticks: { color: '#8b949e', font: { weight: 'bold', size: 10 }, callback: value => value + '%' },
              grid: { color: '#21262d' }
            }
          }
        }
      });
    }, 100);
  }

  // รองรับปุ่ม Back ของ Android / ปัดย้อนกลับบน iPhone
  function showDetailView() {
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';
    if (!history.state || history.state.view !== 'detail') {
      history.pushState({ view: 'detail' }, '');
    }
  }

  function showHomeView(fromPop) {
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('home-view').style.display = 'block';
    window.scrollTo(0, 0);
    if (!fromPop && history.state && history.state.view === 'detail') {
      history.back();
    }
  }

  window.addEventListener('popstate', function() {
    if (document.getElementById('detail-view').style.display === 'block') {
      showHomeView(true);
    }
  });
</script>

</body>
</html>
